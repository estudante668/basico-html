<!DOCTYPE html>
<html lang="pt-BR">
  <head>
      <!--Configração de caracteres-->
    <meta charset="utf-8">  
      <!--é um dos elementos mais importantes para SEO e usabilidade-->
      <title>Meu Site</title>
      <!--sem essa meta, navegadores móveis aplicam uma viewport padrão (geralmente ~980px) e então escalam a página, 
      o que deixa o layout “encolhido” em celulares-->
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <!--motores de busca frequentemente usam esse texto como o “snippet” exibido nos resultados de busca;
      portanto afeta CTR (taxa de clique).-->
        <meta name="description" content="Meu site">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
   <h1><span style="font-size: 32px; margin: 21px 0;">Ingradientes</span></h1>
   <ul>
    <li>1 xícara de chá de açúcar</li>
    <li>2 xícaras de chá de farinha de trigo</li>
    <li>3 ovos</li>
    <li>1/2 xícara de chá de óleo</li>
    <li>1 xícara de chá de leite</li>
    <li>1 colher de sopa de fermento em pó</li> 
   </ul> 
  </body>
</html>
